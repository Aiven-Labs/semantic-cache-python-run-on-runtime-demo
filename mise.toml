[tasks.up]
run = "fnox exec -- docker compose up --build"

[tasks.dev]
run = "fnox exec -- uv run uvicorn semcache.app:app --app-dir src --reload"

[tasks.test]
run = "uv run pytest"

[tasks.lint]
run = "uv run ruff check . && uv run ruff format --check ."

# Terminal UI. Needs the web app running (mise run up). Point it elsewhere with SCOUT_URL, and set
# SCOUT_GH_USER so copied manifest entries point at your fork.
[tasks.tui]
run = "PYTHONPATH=src uv run --extra tui python -m semcache.tui"

# Benchmarks. They need the secrets in fnox (TYPESAFE_API_KEY, SEMCACHE_LLM_*), and the routing one
# also needs Valkey and the embeddings server up. Both write a report into benchmarks/.
[tasks.bench-classifiers]
run = "fnox exec -- env PYTHONPATH=src uv run python benchmarks/compare_classifiers.py"

[tasks.bench-routing]
run = "fnox exec -- env PYTHONPATH=src uv run python benchmarks/run_routing.py"
