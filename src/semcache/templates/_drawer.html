<div id="backdrop"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Project details" aria-hidden="true">
  <div class="drawer-bar"><button type="button" id="drawer-close" aria-label="Close details">Close &times;</button></div>
  <div id="drawer-body" aria-live="polite"></div>
</aside>
<script src="/static/vendor/htmx.min.js"></script>
<script>
(function () {
  const drawer = document.getElementById("drawer"), backdrop = document.getElementById("backdrop");
  const body = document.getElementById("drawer-body");
  let opener = null;
  function open() {
    drawer.classList.add("open"); backdrop.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
  }
  function close() {
    drawer.classList.remove("open"); backdrop.classList.remove("open"); drawer.setAttribute("aria-hidden", "true");
    if (opener) { opener.focus(); opener = null; }
  }
  // Open as soon as a details request starts, so the panel slides in while it loads.
  document.body.addEventListener("htmx:beforeRequest", e => {
    if (e.detail.target !== body) return;
    if (e.detail.requestConfig.verb === "get") body.innerHTML = '<p class="muted" style="padding:8px 0">Loading&hellip;</p>';
    if (e.detail.elt.classList.contains("js-detail")) opener = e.detail.elt;
    open();
  });
  document.body.addEventListener("htmx:afterSwap", e => { if (e.detail.target === body) drawer.scrollTop = 0; });
  document.body.addEventListener("htmx:responseError", e => {
    if (e.detail.target === body) body.innerHTML = '<p class="warn">Could not load details (HTTP ' + e.detail.xhr.status + ').</p>';
  });
  document.getElementById("drawer-close").addEventListener("click", close);
  backdrop.addEventListener("click", close);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("open")) close(); });
})();
</script>
