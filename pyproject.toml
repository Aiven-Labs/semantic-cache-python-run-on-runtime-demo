[project]
name = "template-scout"
version = "0.1.0"
description = "Find open-source apps worth adding to templates.aiven.io, using Valkey vector search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langchain-openai>=0.3",
    "numpy>=2.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.32",
    "valkey>=6.0",
]

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]
report = [
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=5.0.1",
    "ruff>=0.8",
    "textual>=8.2.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literals in test data

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
